services:
  nut-ui:
    image: ghcr.io/elpaul0/nut-ui:latest
    container_name: nut-ui
    restart: unless-stopped
    ports:
      - "${LISTEN_PORT:-8765}:8765"
    env_file:
      - .env
    environment:
      NUT_UI_DB: /data/events.db
    volumes:
      - nut-ui-data:/data

volumes:
  nut-ui-data:
